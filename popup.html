<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
  body { font-family: sans-serif; width: 360px; padding: 12px; margin: 0; max-height: 560px; overflow-y: auto; }
  h3 { margin: 0 0 10px; font-size: 15px; }
  h4 { margin: 14px 0 6px; font-size: 13px; border-top: 1px solid #ddd; padding-top: 10px; }
  label { display: block; margin-bottom: 8px; font-size: 13px; }
  select { width: 100%; padding: 4px; margin-top: 4px; box-sizing: border-box; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 48px;
    font-size: 12px;
    margin-top: 4px;
    resize: vertical;
    font-family: inherit;
  }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; }
  .checkbox-row input { margin: 0; }
  .hint { font-size: 11px; color: #777; margin: -4px 0 8px; }
  button {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  #status { font-size: 12px; color: #2a2; min-height: 14px; margin-top: 6px; }
</style>
</head>
<body>
  <h3 id="txt-title">People's YouTube — настройки</h3>

  <label>
    <span id="txt-language-label">Язык плагина</span>
    <select id="language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </label>

  <div class="checkbox-row">
    <input type="checkbox" id="bannerEnabled" />
    <label for="bannerEnabled" id="txt-banner-label" style="margin:0;">Показывать плашку сверху</label>
  </div>

  <h4 id="txt-discovery-heading">Режим открытий</h4>
  <div class="checkbox-row">
    <input type="checkbox" id="discoveryVideoEnabled" />
    <label for="discoveryVideoEnabled" id="txt-discovery-video-label" style="margin:0;">Для видео (&lt; 1000 просмотров)</label>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="discoveryStreamsEnabled" />
    <label for="discoveryStreamsEnabled" id="txt-discovery-streams-label" style="margin:0;">Для стримов (&lt; 50 зрителей)</label>
  </div>

  <h4 id="txt-scam-heading">Скам / опасное ПО</h4>
  <div class="checkbox-row">
    <input type="checkbox" id="scamFilterEnabled" />
    <label for="scamFilterEnabled" id="txt-scam-enable-label" style="margin:0;">Включить фильтр</label>
  </div>
  <label>
    <span id="txt-scam-words-label">Стоп-слова (через запятую; можно regex, ищется с флагом /i)</span>
    <textarea id="scamWords"></textarea>
  </label>

  <h4 id="txt-clickbait-heading">Кликбейт / брейнрот</h4>
  <div class="checkbox-row">
    <input type="checkbox" id="clickbaitFilterEnabled" />
    <label for="clickbaitFilterEnabled" id="txt-clickbait-enable-label" style="margin:0;">Включить фильтр</label>
  </div>
  <label>
    <span id="txt-clickbait-words-label">Стоп-слова (через запятую)</span>
    <textarea id="clickbaitWords"></textarea>
  </label>

  <label>
    <span id="txt-whitelist-label">Исключения из фильтра капса (через запятую)</span>
    <textarea id="whitelistWords"></textarea>
  </label>
  <div class="hint" id="txt-whitelist-hint">Если в названии есть такое слово — проверка на капс не сработает (сам кликбейт по стоп-словам и эмодзи всё равно проверяется).</div>

  <h4 id="txt-blacklist-heading">Чёрный список («не хочу видеть»)</h4>
  <div class="checkbox-row">
    <input type="checkbox" id="blacklistEnabled" />
    <label for="blacklistEnabled" id="txt-blacklist-enable-label" style="margin:0;">Включить чёрный список</label>
  </div>
  <label>
    <span id="txt-blacklist-words-label">Слова (через запятую)</span>
    <textarea id="blacklistWords"></textarea>
  </label>

  <button id="save">Сохранить</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
